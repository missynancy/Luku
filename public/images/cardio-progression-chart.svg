<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background:#EDE6D8; border-radius:12px; font-family:'Inter', -apple-system, sans-serif;">
  <style>
    .brand { font-size: 13px; font-weight: 600; fill: #5B4030; }
    .eyebrow { font-family: 'Georgia', serif; font-style: italic; font-size: 18px; fill: #B08B5D; }
    .headline { font-family: 'Georgia', serif; font-weight: 700; font-size: 34px; fill: #372A21; }
    .accent { fill: #B4552E; }
    .label { font-family: 'Georgia', serif; font-style: italic; font-size: 17px; fill: #5B4030; }
    .time { font-size: 14px; font-weight: 600; fill: #5B4030; }
    .legend-text { font-size: 13px; fill: #5B4030; font-weight: 500; }
    .tagline { font-family: 'Georgia', serif; font-style: italic; font-size: 15px; fill: #5B4030; }
  </style>

  <!-- Header Section -->
  <line x1="40" y1="45" x2="60" y2="45" stroke="#5B4030" stroke-width="1.5" opacity="0.6" />
  <text x="70" y="49" class="brand">SmartLukuFitness — Fitness</text>

  <text x="40" y="85" class="eyebrow">Kupiga luku, made simple</text>

  <text x="40" y="125" class="headline">How to <tspan class="accent">progress</tspan></text>
  <text x="40" y="160" class="headline">your cardio</text>

  <!-- Progress Rows -->
  <!-- Row 1: Start -->
  <g transform="translate(40, 195)">
    <text x="0" y="20" class="label">Start</text>
    <rect x="65" y="6" width="260" height="18" rx="9" fill="#5B4030" fill-opacity="0.12" />
    <rect x="65" y="6" width="65" height="18" rx="9" fill="#B08B5D" />
    <text x="410" y="20" class="time" text-anchor="end">15s / 45s</text>
  </g>

  <!-- Row 2: Build -->
  <g transform="translate(40, 245)">
    <text x="0" y="20" class="label">Build</text>
    <rect x="65" y="6" width="260" height="18" rx="9" fill="#5B4030" fill-opacity="0.12" />
    <rect x="65" y="6" width="86" height="18" rx="9" fill="#B08B5D" />
    <text x="410" y="20" class="time" text-anchor="end">20s / 40s</text>
  </g>

  <!-- Row 3: Next -->
  <g transform="translate(40, 295)">
    <text x="0" y="20" class="label">Next</text>
    <rect x="65" y="6" width="260" height="18" rx="9" fill="#5B4030" fill-opacity="0.12" />
    <rect x="65" y="6" width="130" height="18" rx="9" fill="#B08B5D" />
    <text x="410" y="20" class="time" text-anchor="end">30s / 30s</text>
  </g>

  <!-- Row 4: Later -->
  <g transform="translate(40, 345)">
    <text x="0" y="20" class="label">Later</text>
    <rect x="65" y="6" width="260" height="18" rx="9" fill="#5B4030" fill-opacity="0.12" />
    <rect x="65" y="6" width="172" height="18" rx="9" fill="#B08B5D" />
    <text x="410" y="20" class="time" text-anchor="end">40s / 20s</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 405)">
    <circle cx="6" cy="6" r="5" fill="#B08B5D" />
    <text x="18" y="10" class="legend-text">Work</text>

    <circle cx="80" cy="6" r="5" fill="#5B4030" fill-opacity="0.2" />
    <text x="92" y="10" class="legend-text">Rest</text>
  </g>

  <!-- Footer Tagline -->
  <text x="40" y="455" class="tagline">Move at your level. Progress when it feels easy.</text>
</svg>
